<!DOCTYPE html>
<html lang="en">

<head>
    <script type="text/javascript" src="https://miro.com/app/static/sdk.1.1.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <link rel="stylesheet" href="https://miro.com/app/static/styles.1.0.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="feeback-modal">
    <h2 class="miro-h2 feedback-header">Feedback</h2>
    <p class="miro-p-large">Data used soley for the purpose of improving Miro plugins we make</p>
    <input class="miro-input miro-input--primary miro-input--small feedback-input" placeholder="Name"
        id="feedback-input-name" />
    <input class="miro-input miro-input--primary miro-input--small feedback-input" placeholder="Email (optional)"
        id="feedback-input-email" />
    <textarea rows="3" class="miro-input miro-input--primary miro-input--small feedback-input multiline"
        placeholder="Add your feedback" id="feedback-input-message"></textarea>
    <a href="https://docs.google.com/document/d/1LHb4au6uPryduCxDI2L7kLHD3jhuBcjhUWvPlIB87dM/" target="blank">
        <p class="miro-p-large inline-block privacy-policy" style="line-height: 16px">
            Privacy policy
        </p>
    </a>
    <button class="miro-btn miro-btn--primary miro-btn--small float-right send-button" id="send-button">
        Send
    </button>
    <button class="miro-btn miro-btn--secondary miro-btn--small float-right" onclick="miro.board.ui.closeModal()">
        Cancel
    </button>
    <script>
        window.firebase.initializeApp({ projectId: 'carboncopy-4f14e' });
        const submitButton = document.getElementById('send-button');
        submitButton.addEventListener('click', () => {

            submitButton.disabled = true;
            submitButton.innerText = "Sending...";

            const name = document.getElementById('feedback-input-name');
            const email = document.getElementById('feedback-input-email');
            const message = document.getElementById('feedback-input-message');

            const feedback = window.firebase.firestore().collection('feedback');
            feedback.doc(new Date().getTime() + Math.random().toString().slice(2))
                .set({ name: name.value, email: email.value, message: message.value, date: new Date() })
                .finally(() => miro.board.ui.closeModal());
        });
    </script>
</body>

</html>
