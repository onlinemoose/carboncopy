<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://miro.com/app/static/styles.1.0.css" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.20/lodash.min.js"></script>
    <script src="https://miro.com/app/static/sdk.1.1.js"></script>
    <script type="text/javascript" src="util.js"></script>

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }

        .header {
            width: 340px;
            left: 0px;
            top: 0px;
            border-radius: 0px;
        }

        .header-text {
            font-size: 24px;
            font-style: normal;
            font-weight: 700;
            line-height: 32px;
            letter-spacing: 0px;
            text-align: left;
            color: #050038;
            margin-left: 24px;
            margin-top: 20px;
            border-radius: 0px;
            margin-right: 60px;
        }

        .header-text-clickable {
            cursor: pointer;
        }

        .line {
            height: 1px;
            border-radius: 0px;
            background-color: #E1E0E7;
            margin: 24px;
            margin-top: 16px;
            margin-bottom: 16px;
        }

        .default-text {
            font-size: 20px;
            font-style: normal;
            font-weight: 400;
            line-height: 28px;
            letter-spacing: 0px;
            text-align: left;
            color: #4262FF;
            margin-top: 20px;
            margin-left: 24px;
        }

        .widget-text {
            font-size: 20px;
            font-style: normal;
            font-weight: 400;
            line-height: 28px;
            min-height: 28px;
            letter-spacing: 0px;
            text-align: left;
            padding: 10px;
            margin-left: 24px;
            cursor: pointer;
            margin-right: 4px;
            user-select: none;
            padding-right: 48px;
            overflow-wrap: break-word;
        }

        [contenteditable]:focus {
            outline: 1px solid grey;
        }

        .hide {
            display: none !important;
        }

        .pin-icon {
            transform: rotate(45deg);
            float: right;
            margin-right: 12px;
            margin-top: -48px;
            cursor: pointer;
            padding: 12px;
        }

        .color-primary {
            color: #4262FF;
            fill: #4262FF;
        }

        .list>li {
            font-size: 16px;
            margin-left: 8px;
            padding: 12px;
            cursor: pointer;
            user-select: none;
            padding-right: 60px;
            overflow-wrap: break-word;
        }

        .overflow-icon {
            display: none;
            margin-top: -28px;
            padding: 8px;
            position: fixed;
            right: 8px;
            background-color: rgba(255, 255, 255, 1);
        }

        .deleted-icon {
            fill: #fbc02d;
            margin-top: -2px;
            position: fixed;
            padding-left: 4px;
        }

        .overflow-icon:hover {
            background-color: rgba(245, 245, 245, 1);
            border-radius: 4px;
        }

        .list-item {
            margin-right: 4px;
        }

        .list-item:hover .overflow-icon {
            display: block;
        }

        .list-drag {
            background-color: #dadada;
            opacity: 0.2;
        }

        .context-menu {
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.12);
            background-color: rgba(255, 255, 255, 1);
            width: 200px;
            border-radius: 4px;
            z-index: 100;
            overflow: hidden;
            padding-top: 12px;
            padding-bottom: 12px;
            margin-right: 16px;
            cursor: pointer;
            position: absolute;
        }

        .context-menu-item {
            padding: 14px;
            padding-left: 32px;
        }

        .context-menu-item:hover {
            background-color: rgba(0, 0, 0, 0.06);
        }

        .footer {
            display: inline-flex;
            padding: 16px;
            position: fixed;
            bottom: 0;
        }

        .footer-paste {
            display: inline-flex;
            margin: 16px;
            position: fixed;
            bottom: 0;
            width: calc(100% - 32px);
        }

        .footer-hint {
            width: 60%;
            padding-right: 24px;
        }

        .footer-button {
            width: 40%;
            margin-top: 12px;
        }

        .footer-paste-button {
            width: 50%;
            margin-top: 12px;
        }

        .footer-paste-cancel-button {
            width: 50%;
            margin-top: 12px;
            border-color: #CDCCD7;
            background-color: #CDCCD7;
        }


        .footer-paste-cancel-button:hover {
            border-color: #A4A3AC;
            background-color: #A4A3AC;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-text" id="header-text"></div>
    </div>
    <div class="line"></div>

    <div class="default-text" id="default-text">Select a sticky note to start</div>

    <div id="default-text-container" class="hide">
        <div id="draggable-container">
            <div class="widget-text" id="widget-text">
            </div>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" id="pin-icon" enable-background="new 0 0 24 24" height="24"
            viewBox="0 0 24 24" width="24" class="pin-icon">
            <g>
                <rect fill="none" height="24" width="24" />
            </g>
            <g>
                <path
                    d="M14,4v5c0,1.12,0.37,2.16,1,3H9c0.65-0.86,1-1.9,1-3V4H14 M17,2H7C6.45,2,6,2.45,6,3c0,0.55,0.45,1,1,1c0,0,0,0,0,0l1,0v5 c0,1.66-1.34,3-3,3v2h5.97v7l1,1l1-1v-7H19v-2c0,0,0,0,0,0c-1.66,0-3-1.34-3-3V4l1,0c0,0,0,0,0,0c0.55,0,1-0.45,1-1 C18,2.45,17.55,2,17,2L17,2z" />
            </g>
        </svg>

        <ol id="list" class="list">
        </ol>
    </div>

    <!-- Keep the context menu hidden by default-->
    <div class="context-menu hide" id="context-menu">
        <div class="context-menu-item" id="btn-cut">Cut</div>
        <div class="context-menu-item" id="btn-copy">Copy</div>
        <div class="context-menu-item" id="btn-moveup">Move up</div>
        <div class="context-menu-item" id="btn-movedown">Move down</div>
        <div class="context-menu-item" id="btn-rename">Rename</div>
        <div class="context-menu-item" id="btn-delete">Delete</div>
    </div>

    <!-- Keep the footer hidden by default-->
    <div class="footer hide" id="footer">
        <p class="miro-p-small footer-hint">
            Set a frame by selecting one on the board
        </p>
        <button class="miro-btn miro-btn--primary miro-btn--small footer-button" id="set-frame">
            Set frame
        </button>
    </div>

    <div class="footer-paste hide" id="footer-paste">
        <button class="miro-btn miro-btn--small footer-paste-cancel-button" id="paste-cancel-frame">
            Cancel
        </button>
        <button class="miro-btn miro-btn--primary miro-btn--small footer-paste-button" id="paste-frame">
            Paste
        </button>
    </div>

    <script>
        document.getElementById("header-text").innerText = getAppName();
    </script>
    <script src="sidebar.js"></script>
</body>

</html>
