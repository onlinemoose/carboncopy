<!DOCTYPE html>
<html lang="en">

<head>
    <script type="text/javascript" src="https://miro.com/app/static/sdk.1.1.js"></script>
    <script type="text/javascript" src="main.js"></script>
    <link rel="stylesheet" href="https://miro.com/app/static/styles.1.0.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <span class="top-row-filler"></span>
    <h2 className='miro-h2' style="margin-left: 24px">CarbonCopy</h2>
    <div className='divider' style="height: 1px; margin: 0 16px 0 16px; background-color: #cdccd7;"></div>
    <div style="display: flex;">
        <div style="width: 50vw;">
            <span class="select-widget" id="sync-widget">
                <p class="miro-p-medium flex-grow right-align-text">Sync</p>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#000000"
                    class="sync-icon">
                    <path d="M.01 0h24v24h-24V0z" fill="none" />
                    <path
                        d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" />
                </svg>
            </span>
            <span class="select-widget" id="desync-widget">
                <p class="miro-p-medium flex-grow right-align-text">De-sync</p>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#000000"
                    class="sync-icon">
                    <path d="M0 0h24v24H0V0zm0 0h24v24H0V0z" fill="none" />
                    <path
                        d="M10 6.35V4.26c-.66.17-1.29.43-1.88.75l1.5 1.5c.13-.05.25-.11.38-.16zM20 12c0-2.21-.91-4.2-2.36-5.64L20 4h-6v6l2.24-2.24C17.32 8.85 18 10.34 18 12c0 .85-.19 1.65-.51 2.38l1.5 1.5C19.63 14.74 20 13.41 20 12zM4.27 4L2.86 5.41l2.36 2.36C4.45 8.99 4 10.44 4 12c0 2.21.91 4.2 2.36 5.64L4 20h6v-6l-2.24 2.24C6.68 15.15 6 13.66 6 12c0-1 .25-1.94.68-2.77l8.08 8.08c-.25.13-.5.24-.76.34v2.09c.8-.21 1.55-.54 2.23-.96l2.58 2.58 1.41-1.41L4.27 4z" />
                </svg>
            </span>
        </div>
        <div style="width: 50vw;">
            <span class="select-widget" id="select-widget">
                <p class="miro-p-medium flex-grow right-align-text">Select</p>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#000000"
                    class="sync-icon">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M3 5h2V3c-1.1 0-2 .9-2 2zm0 8h2v-2H3v2zm4 8h2v-2H7v2zM3 9h2V7H3v2zm10-6h-2v2h2V3zm6 0v2h2c0-1.1-.9-2-2-2zM5 21v-2H3c0 1.1.9 2 2 2zm-2-4h2v-2H3v2zM9 3H7v2h2V3zm2 18h2v-2h-2v2zm8-8h2v-2h-2v2zm0 8c1.1 0 2-.9 2-2h-2v2zm0-12h2V7h-2v2zm0 8h2v-2h-2v2zm-4 4h2v-2h-2v2zm0-16h2V3h-2v2zM7 17h10V7H7v10zm2-8h6v6H9V9z" />
                </svg>
            </span>
            <span class="select-widget" id="clone-widget">
                <p class="miro-p-medium flex-grow right-align-text">Duplicate</p>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#000000"
                    class="sync-icon">
                    <path d="M0 0h24v24H0V0z" fill="none" />
                    <path
                        d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                </svg>
            </span>
            <span class="select-widget" id="delete-widget">
                <p class="miro-p-medium flex-grow right-align-text">Delete</p>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#000000"
                    class="sync-icon">
                    <path d="M0 0h24v24H0V0z" fill="none" />
                    <path
                        d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z" />
                </svg>
            </span>
        </div>
    </div>
    <div style="display: flex;" id="sync-prop-head">
        <div style="width: 60vw;">
            <h3 className='miro-h2' style="margin-left: 24px">Sync Properties</h3>
        </div>
        <div style="width: 40vw; text-align: right; margin: 1em; line-height: 2em;" class="color-primary">
            Parent widget
        </div>
    </div>
    <div style="display: flex;" id="sync-prop">
        <div style="width: 50vw; padding-left: 24px;">
            <label class="miro-checkbox" style="display: block; margin: 12px 0 12px 0;">
                <input type="checkbox" checked>
                <span>Text</span>
            </label>
            <label class="miro-checkbox" style="display: block; margin: 12px 0 12px 0;">
                <input type="checkbox" checked>
                <span>Tags</span>
            </label>
            <label class="miro-checkbox" style="display: block; margin: 12px 0 12px 0;">
                <input type="checkbox" checked>
                <span>Dimensions</span>
            </label>
        </div>
        <div style="width: 50vw; padding-left: 24px;">
            <label class="miro-checkbox" style="display: block; margin: 12px 0 12px 0;">
                <input type="checkbox" checked>
                <span>Widget Styles</span>
            </label>
            <label class="miro-checkbox" style="display: block; margin: 12px 0 12px 0;">
                <input type="checkbox" checked>
                <span>Text Styles</span>
            </label>
        </div>
    </div>
    <div className='divider' style="height: 1px; margin: 8px 16px 8px 16px; background-color: #cdccd7;"></div>
    <span class="select-widget anchor-bottom" id="feedback-widget">
        <p class="miro-p-medium flex-grow right-align-text">Feedback</p>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#000000"
            class="sync-icon">
            <path d="M0 0h24v24H0V0z" fill="none" />
            <path
                d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17l-.59.59-.58.58V4h16v12zm-9-4h2v2h-2zm0-6h2v4h-2z" />
        </svg>
    </span>
</body>

</html>
